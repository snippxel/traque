<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Variante "maskable" (Android adaptive icons).
       Android recadre l'icône dans un cercle de 80 % : tout ce qui dépasse d'un
       rayon de ~205 sur une grille de 512 est coupé. Les pointes des traits de
       visée montent à 230 du centre, elles seraient donc tronquées.
       Le dessin est ici réduit à 80 % pour tenir dans la zone sûre — c'est la
       SEULE différence avec icon.svg, la composition est identique. -->
  <rect width="512" height="512" fill="#0A1330"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <path d="M256 256 L256 110 A146 146 0 0 1 402 256 Z" fill="#FF2E88" opacity="0.34"/>
    <circle cx="256" cy="256" r="146" fill="none" stroke="#C6FF00" stroke-width="30"/>
    <path d="M256 26v112M256 374v112M26 256h112M374 256h112" stroke="#C6FF00" stroke-width="30"/>
    <circle cx="256" cy="256" r="42" fill="#FF2E88"/>
  </g>
</svg>
