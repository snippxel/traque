<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- TRAQUE — réticule, direction DIFFUSION.
       Même anatomie que l'icône d'origine (anneau, quatre traits de visée coupés
       au centre, point central, quart de balayage radar), mais :
       - l'anneau intérieur à 4 px est supprimé : rendu à 48 px il valait 0,37 px
         et le navigateur l'effaçait ;
       - les traits passent de 8 à 30 pour survivre aux petites tailles ;
       - le balayage passe de 14 % à 34 % d'opacité, sinon il disparaît ;
       - le point central est magenta : c'est TOI qui es dans le viseur. -->
  <rect width="512" height="512" fill="#0A1330"/>
  <path d="M256 256 L256 110 A146 146 0 0 1 402 256 Z" fill="#FF2E88" opacity="0.34"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#C6FF00" stroke-width="30"/>
  <path d="M256 26v112M256 374v112M26 256h112M374 256h112" stroke="#C6FF00" stroke-width="30"/>
  <circle cx="256" cy="256" r="42" fill="#FF2E88"/>
</svg>
